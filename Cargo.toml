[package]
name = "atk68"
version = "0.1.0"
edition = "2021"
description = "Offline, cross-platform configuration tool for the ATK68 keyboard (WebHID-free)"
license = "MIT"

[dependencies]
hidapi = "2"
clap = { version = "4", features = ["derive"] }
anyhow = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
strip = true
lto = true
